<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e4" />
    <title>Amanda Home & Deco | Decoración, textiles y cerámica en Grand Bourg</title>
    <meta data-rh="true"
      name="description"
      content="Amanda Home & Deco: textiles, cerámica y objetos de decoración para tu casa. Comprá online o visitá el local en Grand Bourg, Buenos Aires."
    />
    <meta data-rh="true" property="og:site_name" content="Amanda Home & Deco" />
    <meta data-rh="true" property="og:locale" content="es_AR" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:title" content="Amanda Home & Deco" />
    <meta
      property="og:description"
      content="Textiles, cerámica y decoración para tu casa. Tienda online y local en Grand Bourg, Buenos Aires."
    />
    <meta data-rh="true" property="og:image" content="%VITE_SITE_URL%/local-estanterias.jpeg" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap"
    />
    <script>
      (function () {
        try {
          var p = localStorage.getItem("amanda:theme");
          var dark =
            p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add(dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
